security:
    password_hashers:
        App\Entity\Users: auto
    providers:
        app_users:
            entity:
                class: App\Entity\Users
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true
    access_control:
        - { path: ^/app, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\Users:
                algorithm: bcrypt
                cost: 4
