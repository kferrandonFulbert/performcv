<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">Illustration d’un CV Classique ATS sur une colonne</title><desc id="desc">Document fictif : profil, expériences, formations et compétences dans un ordre linéaire.</desc>
<rect width="640" height="820" rx="20" fill="#f0ede7"/><rect x="48" y="32" width="544" height="756" rx="4" fill="white"/>
<g font-family="Arial,sans-serif" fill="#182b3c"><text x="90" y="100" font-size="14" letter-spacing="2">CURRICULUM VITAE</text><text x="90" y="146" font-size="32" font-weight="bold">Prénom Nom</text><text x="90" y="178" font-size="18">Intitulé du poste recherché</text><text x="90" y="208" font-size="13">Ville · Coordonnées à personnaliser</text><path d="M90 238H550" stroke="#182b3c" stroke-width="2"/>
<g font-size="18" font-weight="bold"><text x="90" y="282">PROFIL</text><text x="90" y="396">EXPÉRIENCES</text><text x="90" y="554">FORMATIONS</text><text x="90" y="674">COMPÉTENCES</text></g><g font-size="14"><text x="90" y="426">Poste occupé · Entreprise · Dates</text><text x="90" y="584">Diplôme · Établissement · Année</text><text x="90" y="706">Compétences utiles au poste</text></g></g>
